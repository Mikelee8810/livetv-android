name: Release APK

# Manual run from the Actions tab, or push a version tag like v4.2.0.
# Builds the minified release APK, signs it with the key stored in the
# KEYSTORE_* repository secrets, and publishes it as a GitHub Release asset.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v4.2.0)"
        required: true
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install platform and build tools
        # ubuntu-latest runners ship the Android SDK already; just add the
        # platform and build-tools this project targets and accept licenses
        # non-interactively (the setup-android action's license step is flaky).
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out livetv-release.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify livetv-release.apk
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" livetv-release.apk \
            --title "LiveTV $TAG" \
            --notes "Signed release APK built by GitHub Actions. See README for what changed." \
            --repo "$GITHUB_REPOSITORY" || \
          gh release upload "$TAG" livetv-release.apk --clobber --repo "$GITHUB_REPOSITORY"
